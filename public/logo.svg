<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="rkwBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0e6245" />
      <stop offset="60%" stop-color="#073d2b" />
      <stop offset="100%" stop-color="#031f16" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe699" />
      <stop offset="35%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="innerGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.2" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Outer Hexagonal / Circular Royal Seal -->
  <circle cx="250" cy="250" r="236" fill="url(#rkwBg)" stroke="url(#goldGrad)" stroke-width="8" filter="url(#shadow)" />
  <circle cx="250" cy="250" r="222" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6,4" opacity="0.7" />
  <circle cx="250" cy="250" r="214" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.9" />

  <!-- Laurel Wreath Garland (Wheat/Mustard Stalks) -->
  <g fill="url(#goldGrad)" opacity="0.85">
    <!-- Left Stalk Leaves -->
    <path d="M 120,240 C 110,210 130,180 145,170 C 140,190 135,215 120,240 Z" />
    <path d="M 105,270 C 90,250 100,220 120,210 C 120,230 115,255 105,270 Z" />
    <path d="M 105,305 C 90,290 95,260 115,255 C 118,275 112,295 105,305 Z" />
    <path d="M 118,340 C 105,330 105,300 125,295 C 130,315 125,330 118,340 Z" />
    <path d="M 140,370 C 130,360 128,335 145,330 C 150,348 145,362 140,370 Z" />
    <path d="M 172,398 C 160,390 155,370 172,360 C 180,375 178,390 172,398 Z" />

    <!-- Right Stalk Leaves -->
    <path d="M 380,240 C 390,210 370,180 355,170 C 360,190 365,215 380,240 Z" />
    <path d="M 395,270 C 410,250 400,220 380,210 C 380,230 385,255 395,270 Z" />
    <path d="M 395,305 C 410,290 405,260 385,255 C 382,275 388,295 395,305 Z" />
    <path d="M 382,340 C 395,330 395,300 375,295 C 370,315 375,330 382,340 Z" />
    <path d="M 360,370 C 370,360 372,335 355,330 C 350,348 355,362 360,370 Z" />
    <path d="M 328,398 C 340,390 345,370 328,360 C 320,375 322,390 328,398 Z" />
  </g>

  <!-- Traditional Wooden Kolhu (Lakdi Ki Ghani Mortar & Pestle) -->
  <g transform="translate(0, -10)">
    <!-- Base / Mortar (Kolhu Kunda) -->
    <path d="M 195,270 L 305,270 L 290,320 L 210,320 Z" fill="#9a3412" stroke="url(#goldGrad)" stroke-width="3" />
    <path d="M 200,270 Q 250,285 300,270 Q 250,260 200,270 Z" fill="#c2410c" stroke="url(#goldGrad)" stroke-width="2" />
    <ellipse cx="250" cy="320" rx="40" ry="8" fill="#78240a" />

    <!-- Wooden Pestle (Musal / Ghani Latth) angled traditionally -->
    <path d="M 235,165 L 265,160 L 258,280 L 242,280 Z" fill="#b45309" stroke="url(#goldGrad)" stroke-width="2.5" />
    <ellipse cx="250" cy="162" rx="15" ry="6" fill="#f59e0b" />

    <!-- Pure Golden Oil Drop falling -->
    <path d="M 250,295 C 240,312 236,325 244,335 C 248,340 252,340 256,335 C 264,325 260,312 250,295 Z" fill="url(#goldGrad)" stroke="#ffe699" stroke-width="1.5" />
    <!-- Oil Shimmer -->
    <circle cx="248" cy="328" r="2.5" fill="#ffffff" opacity="0.9" />
  </g>

  <!-- Arch Text: RAMESH KOLHU WALE -->
  <path id="textArcTop" d="M 90,250 A 160,160 0 0,1 410,250" fill="none" />
  <text font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="28" font-weight="900" fill="url(#goldGrad)" letter-spacing="4">
    <textPath href="#textArcTop" startOffset="50%" text-anchor="middle">
      RAMESH KOLHU WALE
    </textPath>
  </text>

  <!-- Big Central Monogram: RKW -->
  <text x="250" y="240" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="64" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="6" filter="url(#shadow)">
    RKW
  </text>
  <text x="250" y="240" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="64" font-weight="900" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="6" opacity="0.9">
    RKW
  </text>

  <!-- Lower Hindi Text: रमेश कोल्हू वाले -->
  <text x="250" y="390" font-family="'Noto Sans Devanagari', 'Poppins', sans-serif" font-size="22" font-weight="800" fill="#fbbf24" text-anchor="middle" letter-spacing="2">
    रमेश कोल्हू वाले
  </text>

  <!-- Bottom Subtext: 100% PURE WOOD PRESSED -->
  <text x="250" y="420" font-family="sans-serif" font-size="12" font-weight="800" fill="#fef08a" text-anchor="middle" letter-spacing="3">
    ★ 100% PURE WOOD PRESSED OILS &amp; GHEE ★
  </text>
  <text x="250" y="438" font-family="sans-serif" font-size="10" font-weight="600" fill="#a7f3d0" text-anchor="middle" letter-spacing="2">
    ESTD 1989 • DELHI NCR
  </text>
</svg>
